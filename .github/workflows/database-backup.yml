name: Encrypted database backup
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: postgres:18
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export and encrypt with owner public key
        run: node scripts/backup-database.mjs
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PUBLIC_KEY: ${{ vars.BACKUP_PUBLIC_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: repair-desk-encrypted-${{ github.run_id }}
          path: repair-desk-backup.encrypted.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Remove runner copy
        if: always()
        run: rm -f repair-desk-backup.encrypted.json
