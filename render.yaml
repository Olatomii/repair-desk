services:
  - type: web
    name: repair-desk
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: repair-desk-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false

databases:
  - name: repair-desk-db
    plan: free
    region: frankfurt
