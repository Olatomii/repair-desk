services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repairdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - repairdesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repairdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repairdesk-postgres:
